name: Deploy Frontend

on:
  push:
    branches: [master]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"

permissions:
  id-token: write # OIDC로 AWS 역할을 임시로 빌리기 위해 필요
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::155641294485:role/gh-actions-factory-vision
          aws-region: ap-northeast-2

      - name: Upload to S3
        run: aws s3 sync frontend/dist s3://factory-vision-web-155641294485-ap-northeast-2-an --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id E2EE21DSEU6BS1 --paths "/*"
